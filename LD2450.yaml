substitutions:
  # Connectivity options (true/false)
  # - Wi-Fi mode: use_wifi: true, use_zigbee: false
  # - Zigbee mode: use_wifi: false, use_zigbee: true
  use_wifi: true
  use_ble_proxy: true   # Only active when use_wifi is true
  use_zigbee: false

packages:
  wifi: !include
    file: packages/wifi.yaml
    condition: ${use_wifi in [true, "true", "True"]}
  ble_proxy: !include
    file: packages/ble_proxy.yaml
    condition: ${(use_wifi in [true, "true", "True"]) and (use_ble_proxy in [true, "true", "True"])}
  zigbee: !include
    file: packages/zigbee.yaml
    condition: ${use_zigbee in [true, "true", "True"]}

esphome:
  name: ld2450
  friendly_name: !secret friendly_name

# Underclocking to half the normal speed for heat management
esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
  cpu_frequency: 80Mhz

# Enable logging
logger:

i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true

uart:
  id: uart_ld2450
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: Presence
    has_moving_target:
      name: Moving Target
    has_still_target:
      name: Still Target

number:
  - platform: ld2450
    ld2450_id: ld2450_radar
    presence_timeout:
      name: "Timeout"
    zone_1:
      x1:
        name: Zone-1 X1
      y1:
        name: Zone-1 Y1
      x2:
        name: Zone-1 X2
      y2:
        name: Zone-1 Y2
    zone_2:
      x1:
        name: Zone-2 X1
      y1:
        name: Zone-2 Y1
      x2:
        name: Zone-2 X2
      y2:
        name: Zone-2 Y2
    zone_3:
      x1:
        name: Zone-3 X1
      y1:
        name: Zone-3 Y1
      x2:
        name: Zone-3 X2
      y2:
        name: Zone-3 Y2

switch:
  - platform: ld2450
    ld2450_id: ld2450_radar
    bluetooth:
      name: "Bluetooth"
    multi_target:
      name: "Multi Target Tracking"
  - platform: gpio
    pin: GPIO3
    id: rf_switch_power
    internal: true
    restore_mode: ALWAYS_OFF   # Drives GPIO3 LOW (enables RF switch on XIAO ESP32-C6)
  - platform: gpio
    pin: GPIO14
    id: antenna_select
    internal: true
    restore_mode: ALWAYS_OFF   # Drives GPIO14 LOW (selects onboard ceramic antenna)

select:
  - platform: ld2450
    ld2450_id: ld2450_radar
    baud_rate:
      name: "Baud rate"
    zone_type:
      name: "Zone Type"

button:
  - platform: ld2450
    ld2450_id: ld2450_radar
    factory_reset:
      name: "LD2450 Factory Reset"
      entity_category: "config"
    restart:
      name: "LD2450 Restart"
      entity_category: "config"

text_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    version:
      name: "LD2450 Firmware"
    mac_address:
      name: "LD2450 BT MAC"
    target_1:
      direction:
        name: "Target-1 Direction"
    target_2:
      direction:
        name: "Target-2 Direction"
    target_3:
      direction:
        name: "Target-3 Direction"

# SHTC3 Temperature and humidity sensor can be enabled by uncommenting the lines below
sensor:
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    update_interval: 30s
    entity_category: diagnostic
    disabled_by_default: false
    unit_of_measurement: °C
    state_class: measurement
    device_class: temperature
  # - platform: shtcx
  #   temperature:
  #     name: "Temperature"
  #     filters:
  #       - offset: -6.0
  #   humidity:
  #     name: "Humidity"
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: Presence Target Count
    still_target_count:
      name: Still Target Count
    moving_target_count:
      name: Moving Target Count
    target_1:
      x:
        name: Target-1 X
        filters: &throttle_1s
          - throttle: 1000ms
      y:
        name: Target-1 Y
        filters: *throttle_1s
      speed:
        name: Target-1 Speed
        filters: *throttle_1s
      angle:
        name: Target-1 Angle
        filters: *throttle_1s
      distance:
        name: Target-1 Distance
        filters: *throttle_1s
      resolution:
        name: Target-1 Resolution
        filters: *throttle_1s
    target_2:
      x:
        name: Target-2 X
        filters: *throttle_1s
      y:
        name: Target-2 Y
        filters: *throttle_1s
      speed:
        name: Target-2 Speed
        filters: *throttle_1s
      angle:
        name: Target-2 Angle
        filters: *throttle_1s
      distance:
        name: Target-2 Distance
        filters: *throttle_1s
      resolution:
        name: Target-2 Resolution
        filters: *throttle_1s
    target_3:
      x:
        name: Target-3 X
        filters: *throttle_1s
      y:
        name: Target-3 Y
        filters: *throttle_1s
      speed:
        name: Target-3 Speed
        filters: *throttle_1s
      angle:
        name: Target-3 Angle
        filters: *throttle_1s
      distance:
        name: Target-3 Distance
        filters: *throttle_1s
      resolution:
        name: Target-3 Resolution
        filters: *throttle_1s
    zone_1:
      target_count:
        name: Zone-1 All Target Count
      still_target_count:
        name: Zone-1 Still Target Count
      moving_target_count:
        name: Zone-1 Moving Target Count
    zone_2:
      target_count:
        name: Zone-2 All Target Count
      still_target_count:
        name: Zone-2 Still Target Count
      moving_target_count:
        name: Zone-2 Moving Target Count
    zone_3:
      target_count:
        name: Zone-3 All Target Count
      still_target_count:
        name: Zone-3 Still Target Count
      moving_target_count:
        name: Zone-3 Moving Target Count
